<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cover-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04120d"/>
      <stop offset="40%" stop-color="#071c14"/>
      <stop offset="80%" stop-color="#05150f"/>
      <stop offset="100%" stop-color="#020906"/>
    </linearGradient>

    <!-- Radial Emerald Ambient Glow -->
    <radialGradient id="cover-glow-right" cx="75%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#4edea3" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#04120d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cover-glow-left" cx="25%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#6ffbbe" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#04120d" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand Text Gradient -->
    <linearGradient id="heading-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#4edea3"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122c22" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#091812" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ffbbe" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#4edea3" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filter -->
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1500" height="500" fill="url(#cover-bg)"/>
  <rect width="1500" height="500" fill="url(#cover-glow-right)"/>
  <rect width="1500" height="500" fill="url(#cover-glow-left)"/>

  <!-- Technical Grid Overlay -->
  <g opacity="0.07" stroke="#4edea3" stroke-width="1">
    <line x1="0" y1="100" x2="1500" y2="100"/>
    <line x1="0" y1="200" x2="1500" y2="200"/>
    <line x1="0" y1="300" x2="1500" y2="300"/>
    <line x1="0" y1="400" x2="1500" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
    <line x1="1000" y1="0" x2="1000" y2="500"/>
    <line x1="1250" y1="0" x2="1250" y2="500"/>
  </g>

  <!-- Left Orbital Radar (Watermark behind avatar area) -->
  <g transform="translate(180, 250)" opacity="0.25">
    <circle r="190" fill="none" stroke="#4edea3" stroke-width="1" stroke-dasharray="10 15"/>
    <circle r="140" fill="none" stroke="#6ffbbe" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle r="90" fill="none" stroke="#4edea3" stroke-width="1"/>
    <!-- Flow Curves -->
    <path d="M -80 -80 C 0 -140, 100 -100, 140 0 C 180 100, 100 160, 0 140" fill="none" stroke="#4edea3" stroke-width="2"/>
  </g>

  <!-- Main Content Cluster (Avatar-Safe Zone: x >= 420) -->
  <g transform="translate(430, 0)">
    <!-- Network & Ecosystem Pill -->
    <g transform="translate(0, 75)">
      <rect width="320" height="32" rx="16" fill="#082218" stroke="#4edea3" stroke-width="1.2" stroke-opacity="0.8"/>
      <circle cx="18" cy="16" r="4.5" fill="#4edea3"/>
      <text x="170" y="21" 
            font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, Consolas, monospace" 
            font-size="12" 
            font-weight="700" 
            letter-spacing="2" 
            fill="#4edea3" 
            text-anchor="middle">BOT CHAIN MAINNET • 677</text>
    </g>

    <!-- Big Brand Display Title -->
    <text x="0" y="175" 
          font-family="Georgia, 'Newsreader', serif" 
          font-size="64" 
          font-weight="700" 
          letter-spacing="-1.5" 
          fill="url(#heading-grad)">HookFlow</text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="215" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
          font-size="21" 
          font-weight="500" 
          fill="#d5e6df">
      Autonomous Native-BOT Treasury Payout Guard
    </text>

    <text x="0" y="245" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" 
          font-size="14.5" 
          font-weight="400" 
          fill="#9ac0b3">
      Shared daily spending caps, operator allowlists &amp; automated burst cooldown defense.
    </text>

    <!-- Capability Tag Pills -->
    <g transform="translate(0, 285)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="30" rx="8" fill="#0c261e" stroke="#4edea3" stroke-width="1" stroke-opacity="0.3"/>
        <text x="67.5" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#6ffbbe" text-anchor="middle">🛡 Bounded Payouts</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(145, 0)">
        <rect width="145" height="30" rx="8" fill="#0c261e" stroke="#4edea3" stroke-width="1" stroke-opacity="0.3"/>
        <text x="72.5" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#6ffbbe" text-anchor="middle">⚡️ Burst Cooldown</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(300, 0)">
        <rect width="135" height="30" rx="8" fill="#0c261e" stroke="#4edea3" stroke-width="1" stroke-opacity="0.3"/>
        <text x="67.5" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#6ffbbe" text-anchor="middle">🔒 Allowlisted Roles</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(445, 0)">
        <rect width="135" height="30" rx="8" fill="#0c261e" stroke="#4edea3" stroke-width="1" stroke-opacity="0.3"/>
        <text x="67.5" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#6ffbbe" text-anchor="middle">⛓ Multi-Vault Isolation</text>
      </g>
    </g>

    <!-- Bottom Chain Invariant Bar -->
    <g transform="translate(0, 360)">
      <line x1="0" y1="0" x2="580" y2="0" stroke="#4edea3" stroke-width="1" stroke-opacity="0.2"/>
      <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="12" fill="#719286">
        EVM Contract • Checks-Effects-Interactions • Reentrancy Safe • Zero Relayers
      </text>
    </g>
  </g>

  <!-- Right Floating Glassmorphic Verification HUD Card -->
  <g transform="translate(1060, 65)">
    <!-- Card Frame -->
    <rect width="380" height="370" rx="16" fill="url(#card-grad)" stroke="url(#border-grad)" stroke-width="1.5"/>

    <!-- Header Inside Card -->
    <g transform="translate(24, 30)">
      <div xmlns="http://www.w3.org/1999/xhtml">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#4edea3; margin-right:8px;"/>
      </div>
      <circle cx="4" cy="4" r="4" fill="#4edea3"/>
      <text x="18" y="8" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#4edea3">
        ON-CHAIN POLICY HUD
      </text>
      <text x="330" y="8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#719286" text-anchor="end">
        v1.0
      </text>
    </g>

    <line x1="24" y1="52" x2="356" y2="52" stroke="#4edea3" stroke-width="1" stroke-opacity="0.15"/>

    <!-- Parameter Rows -->
    <g transform="translate(24, 80)">
      <!-- Row 1 -->
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8ca99e">Target Network</text>
      <text x="332" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="end">BOT Chain (677)</text>

      <!-- Row 2 -->
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8ca99e">Accounting Unit</text>
      <text x="332" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="12" font-weight="600" fill="#6ffbbe" text-anchor="end">Native BOT (Wei)</text>

      <!-- Row 3 -->
      <text x="0" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8ca99e">Daily Allowance Cap</text>
      <text x="332" y="76" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="end">Shared Across Operators</text>

      <!-- Row 4 -->
      <text x="0" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8ca99e">Daily Reset Cycle</text>
      <text x="332" y="114" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="end">00:00 UTC Deterministic</text>

      <!-- Row 5 -->
      <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8ca99e">Burst Cooldown</text>
      <text x="332" y="152" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="12" font-weight="600" fill="#4edea3" text-anchor="end">Auto-Triggered on Limit</text>

      <!-- Row 6 -->
      <text x="0" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8ca99e">Emergency Control</text>
      <text x="332" y="190" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="end">Instant Owner Pause</text>
    </g>

    <!-- Card Footer Verification Stamp -->
    <g transform="translate(24, 320)">
      <rect width="332" height="28" rx="6" fill="#061c13" stroke="#4edea3" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="14" cy="14" r="3.5" fill="#4edea3"/>
      <text x="166" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1" fill="#4edea3" text-anchor="middle">
        VERIFIED ON BOT CHAIN MAINNET
      </text>
    </g>
  </g>
</svg>
