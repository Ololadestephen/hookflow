<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="part-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0c291f"/>
      <stop offset="45%" stop-color="#061912"/>
      <stop offset="85%" stop-color="#030d09"/>
      <stop offset="100%" stop-color="#010604"/>
    </radialGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4edea3" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#061912" stop-opacity="0"/>
    </radialGradient>

    <!-- Emblem Gradients -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ffbbe"/>
      <stop offset="50%" stop-color="#4edea3"/>
      <stop offset="100%" stop-color="#0d523a"/>
    </linearGradient>

    <linearGradient id="botchain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#4edea3"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="pillar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e261d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#061610" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="part-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#part-bg)"/>

  <!-- Orbital Flow Lines / Background Geometry -->
  <g opacity="0.15" stroke="#4edea3">
    <circle cx="600" cy="220" r="280" fill="none" stroke-width="1" stroke-dasharray="10 15"/>
    <circle cx="600" cy="220" r="220" fill="none" stroke-width="1.5"/>
    <circle cx="600" cy="220" r="160" fill="none" stroke-width="1" stroke-dasharray="6 8"/>
    <line x1="100" y1="220" x2="1100" y2="220" stroke-width="0.75" stroke-dasharray="4 8"/>
  </g>

  <!-- Ambient Glow Behind Emblems -->
  <circle cx="600" cy="170" r="240" fill="url(#glow-core)"/>

  <!-- Top Announcement Badge -->
  <g transform="translate(600, 48)">
    <rect x="-190" y="0" width="380" height="30" rx="15" fill="#082218" stroke="#4edea3" stroke-width="1.2" stroke-opacity="0.8"/>
    <circle cx="-168" cy="15" r="4.5" fill="#4edea3"/>
    <text x="10" y="20" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, Consolas, monospace" 
          font-size="11" 
          font-weight="700" 
          letter-spacing="2.2" 
          fill="#4edea3" 
          text-anchor="middle">OFFICIAL ECOSYSTEM INTEGRATION</text>
  </g>

  <!-- Center Co-Branded Dual Emblem Portal -->
  <g transform="translate(600, 155)">
    <!-- Left Emblem: HookFlow Shield Mark -->
    <g transform="translate(-110, 0)" filter="url(#part-glow)">
      <!-- Outer Hexagon Frame -->
      <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="#061c14" stroke="#4edea3" stroke-width="2"/>
      <!-- Shield Wing Left -->
      <path d="M 0 -36 C -20 -28, -28 -12, -28 15 C -20 28, 0 38, 0 38 Z" fill="url(#shield-grad)"/>
      <!-- Shield Wing Right -->
      <path d="M 0 -36 C 20 -28, 28 -12, 28 15 C 20 28, 0 38, 0 38 Z" fill="#248a60"/>
      <!-- Flow Hook Center -->
      <path d="M 6 -18 C 14 -12, 14 0, 4 8 C -6 16, -14 6, -10 -2 C -8 -7, 0 -6, 6 -18 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="3.5" fill="#6ffbbe"/>
    </g>

    <!-- Center Interoperability Bridge -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="24" fill="#061a12" stroke="#4edea3" stroke-width="1.2" stroke-dasharray="3 3"/>
      <!-- Double Arrow Connector -->
      <path d="M -9 -4 L -1 -4 L -1 -7 L 7 0 L -1 7 L -1 4 L -9 4 Z" fill="#4edea3" opacity="0.9"/>
      <circle cx="-18" cy="0" r="2" fill="#6ffbbe"/>
      <circle cx="18" cy="0" r="2" fill="#6ffbbe"/>
    </g>

    <!-- Right Emblem: BOT Chain Emblem -->
    <g transform="translate(110, 0)" filter="url(#part-glow)">
      <!-- Outer Hexagon Frame -->
      <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="#05171f" stroke="#2dd4bf" stroke-width="2"/>
      <!-- Geometric BOT Node Cube / Matrix -->
      <polygon points="0,-32 28,-16 0,0 -28,-16" fill="url(#botchain-grad)" opacity="0.95"/>
      <polygon points="0,0 28,-16 28,16 0,32" fill="#0284c7" opacity="0.85"/>
      <polygon points="0,0 -28,-16 -28,16 0,32" fill="#0369a1" opacity="0.95"/>
      <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Main Headline -->
  <text x="600" y="270" 
        font-family="Georgia, 'Newsreader', serif" 
        font-size="44" 
        font-weight="700" 
        letter-spacing="-1" 
        fill="url(#title-grad)" 
        text-anchor="middle">
    HOOKFLOW ✕ BOT CHAIN
  </text>

  <!-- Subtitle -->
  <text x="600" y="306" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
        font-size="17" 
        font-weight="500" 
        fill="#c3ded3" 
        text-anchor="middle">
    Autonomous Native-BOT Treasury Payout Guard &amp; Flow Control
  </text>

  <!-- 3 Pillar Feature Cards -->
  <g transform="translate(90, 345)">
    <!-- Pillar 1: Bounded Payouts -->
    <g transform="translate(0, 0)">
      <rect width="320" height="205" rx="14" fill="url(#pillar-grad)" stroke="#4edea3" stroke-width="1.2" stroke-opacity="0.3"/>
      <circle cx="36" cy="36" r="16" fill="#08291c" stroke="#4edea3" stroke-width="1" stroke-opacity="0.5"/>
      <text x="36" y="42" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#6ffbbe">🛡</text>
      
      <text x="68" y="41" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Bounded Payouts</text>
      
      <line x1="24" y1="66" x2="296" y2="66" stroke="#4edea3" stroke-width="1" stroke-opacity="0.15"/>
      
      <text x="24" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#6ffbbe">• Max Payment Ceiling</text>
      <text x="24" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8ea89d">Strict cap per single transaction.</text>
      
      <text x="24" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#6ffbbe">• Shared Daily Allowance</text>
      <text x="24" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8ea89d">Aggregated across all vault operators.</text>
      <text x="24" y="188" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#5e7d70">Resets deterministically at 00:00 UTC.</text>
    </g>

    <!-- Pillar 2: Burst Defense -->
    <g transform="translate(350, 0)">
      <rect width="320" height="205" rx="14" fill="url(#pillar-grad)" stroke="#4edea3" stroke-width="1.2" stroke-opacity="0.3"/>
      <circle cx="36" cy="36" r="16" fill="#08291c" stroke="#4edea3" stroke-width="1" stroke-opacity="0.5"/>
      <text x="36" y="42" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#6ffbbe">⚡️</text>
      
      <text x="68" y="41" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Burst Defense</text>
      
      <line x1="24" y1="66" x2="296" y2="66" stroke="#4edea3" stroke-width="1" stroke-opacity="0.15"/>
      
      <text x="24" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#6ffbbe">• Rate Window Tracking</text>
      <text x="24" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8ea89d">Monitors payout frequency in real-time.</text>
      
      <text x="24" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#6ffbbe">• Auto-Triggered Cooldown</text>
      <text x="24" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8ea89d">Reaching threshold freezes further flow.</text>
      <text x="24" y="188" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#5e7d70">Blocks subsequent calls until expiry.</text>
    </g>

    <!-- Pillar 3: Operator Allowlist -->
    <g transform="translate(700, 0)">
      <rect width="320" height="205" rx="14" fill="url(#pillar-grad)" stroke="#4edea3" stroke-width="1.2" stroke-opacity="0.3"/>
      <circle cx="36" cy="36" r="16" fill="#08291c" stroke="#4edea3" stroke-width="1" stroke-opacity="0.5"/>
      <text x="36" y="42" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#6ffbbe">🔒</text>
      
      <text x="68" y="41" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Allowlisted Roles</text>
      
      <line x1="24" y1="66" x2="296" y2="66" stroke="#4edea3" stroke-width="1" stroke-opacity="0.15"/>
      
      <text x="24" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#6ffbbe">• Approved Destinations</text>
      <text x="24" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8ea89d">Payouts restricted to allowlisted addresses.</text>
      
      <text x="24" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#6ffbbe">• Circuit Breaker &amp; Isolated Vaults</text>
      <text x="24" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8ea89d">Instant owner emergency pause switch.</text>
      <text x="24" y="188" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#5e7d70">One vault cannot drain another's balance.</text>
    </g>
  </g>

  <!-- Bottom Verification Footer Bar -->
  <g transform="translate(600, 608)">
    <rect x="-420" y="0" width="840" height="34" rx="8" fill="#051811" stroke="#4edea3" stroke-width="1" stroke-opacity="0.25"/>
    <text x="0" y="21" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, Consolas, monospace" 
          font-size="11.5" 
          font-weight="600" 
          letter-spacing="1" 
          fill="#8eb4a4" 
          text-anchor="middle">
      <tspan fill="#4edea3">BOT CHAIN MAINNET (CHAIN ID 677)</tspan>  •  INTEGER WEI LEDGER  •  CHECKS-EFFECTS-INTERACTIONS
    </text>
  </g>
</svg>
